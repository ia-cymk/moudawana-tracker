name: Update Family Code News

on:
  schedule:
    - cron: '0 8 * * *' # سيعمل يومياً الساعة 8 صباحاً بتوقيت جرينتش
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر متى شئت

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # إعطاء صلاحية للروبوت لحفظ التعديلات في المستودع
    permissions:
      contents: write 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    - name: Run fetch_news.py
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python fetch_news.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "تحديث تلقائي: جلب أحدث أخبار مدونة الأسرة" && git push)
