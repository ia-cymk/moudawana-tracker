<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راصد مدونة الأسرة | المنصة الرسمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300">

    <header class="bg-red-800 dark:bg-gray-950 text-white shadow-md border-b-4 border-red-900 dark:border-red-900 transition-colors duration-300">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="text-3xl">⚖️</span> راصد مدونة الأسرة
            </h1>
            <button id="theme-toggle" class="p-2 rounded-lg bg-red-900 dark:bg-gray-800 hover:bg-red-700 dark:hover:bg-gray-700 transition">
                <span id="theme-toggle-icon" class="text-xl">🌙</span>
            </button>
        </div>
    </header>

    <section class="bg-white dark:bg-gray-800 py-12 border-b dark:border-gray-700 transition-colors duration-300">
        <div class="container mx-auto px-4 text-center max-w-3xl">
            <h2 class="text-3xl font-bold text-red-900 dark:text-red-500 mb-4">تتبع مسار تعديل مدونة الأسرة بالمغرب</h2>
            <p class="text-gray-600 dark:text-gray-400 text-lg">منصة آنية ترصد المستجدات من المصادر الموثوقة فقط.</p>
        </div>
    </section>

    <main class="container mx-auto px-4 py-8">
        
        <div id="stats-banner" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">إجمالي المستجدات</p>
                <p id="stat-total" class="text-3xl font-black text-red-800 dark:text-red-500">0</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">القرارات النهائية</p>
                <p id="stat-final" class="text-3xl font-black text-green-700 dark:text-green-500">0</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center flex flex-col justify-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">الجهة الأكثر نشاطاً</p>
                <p id="stat-top-source" class="text-xl font-bold text-gray-800 dark:text-white">-</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center flex flex-col justify-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold" title="عدد الأيام منذ صدور آخر مستجد رسمي">فترة الهدوء الحالية</p>
                <p id="stat-waiting-time" class="text-xl font-bold text-orange-600 dark:text-orange-400">-</p>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between transition-colors duration-300">
            <div class="w-full md:w-2/3 relative">
                <input type="text" id="searchInput" placeholder="ابحث في المستجدات (مثال: زواج القاصر، التعدد...)" 
                       class="w-full pl-4 pr-10 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-red-800 dark:focus:border-red-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white transition">
                <span class="absolute right-3 top-2.5 text-gray-400 dark:text-gray-500">🔍</span>
            </div>
            <div class="w-full md:w-1/3">
                <select id="sourceFilter" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-red-800 dark:focus:border-red-500 bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-white transition">
                    <option value="all">جميع المصادر الرسمية</option>
                </select>
            </div>
        </div>

        <div class="flex justify-between items-end mb-8 border-r-4 border-red-800 dark:border-red-500 pr-3">
            <h3 class="text-2xl font-bold text-gray-800 dark:text-white">المستجدات الموثقة</h3>
            <span id="last-update" class="text-sm text-gray-500 dark:text-gray-400">جاري التحديث...</span>
        </div>
        
        <!-- حاوية الأخبار -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 align-stretch">
            <!-- الأخبار تظهر هنا -->
        </div>

        <!-- زر عرض المزيد -->
        <div class="text-center mt-10 mb-6">
            <button id="load-more-btn" class="hidden bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold py-3 px-8 rounded-full shadow-sm border border-gray-300 dark:border-gray-600 transition-colors duration-300">
                عرض المزيد من المستجدات ⬇️
            </button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleIcon = document.getElementById('theme-toggle-icon');
            const htmlElement = document.documentElement;
            
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                themeToggleIcon.textContent = '☀️';
            } else {
                htmlElement.classList.remove('dark');
                themeToggleIcon.textContent = '🌙';
            }

            themeToggleBtn.addEventListener('click', function() {
                htmlElement.classList.toggle('dark');
                if (htmlElement.classList.contains('dark')) {
                    localStorage.theme = 'dark';
                    themeToggleIcon.textContent = '☀️';
                } else {
                    localStorage.theme = 'light';
                    themeToggleIcon.textContent = '🌙';
                }
            });
        });

        let allNewsData = [];
        let currentFilteredNews = [];
        let visibleCount = 9;
        const ITEMS_PER_PAGE = 9;

        // رابط موقعك الرسمي (يتم إرفاقه في الرسالة التلقائية عند المشاركة)
        const SITE_URL = "https://ia-cymk.github.io/moudawana-tracker/";

        function getSourceColorClasses(source) {
            if (!source) return { bg: 'bg-gray-100 dark:bg-gray-700', text: 'text-gray-800 dark:text-gray-200', border: 'border-gray-200 dark:border-gray-600' };
            
            if (source.includes('الديوان الملكي') || source.includes('ملك')) {
                return { bg: 'bg-green-100 dark:bg-green-900', text: 'text-green-800 dark:text-green-200', border: 'border-green-200 dark:border-green-700' };
            } else if (source.includes('وزارة العدل') || source.includes('عدل')) {
                return { bg: 'bg-blue-100 dark:bg-blue-900', text: 'text-blue-800 dark:text-blue-200', border: 'border-blue-200 dark:border-blue-700' };
            } else if (source.includes('المجلس العلمي') || source.includes('علمي')) {
                return { bg: 'bg-purple-100 dark:bg-purple-900', text: 'text-purple-800 dark:text-purple-200', border: 'border-purple-200 dark:border-purple-700' };
            } else if (source.includes('وكالة المغرب') || source.includes('MAP')) {
                return { bg: 'bg-orange-100 dark:bg-orange-900', text: 'text-orange-800 dark:text-orange-200', border: 'border-orange-200 dark:border-orange-700' };
            } else if (source.includes('حكوم') || source.includes('أمانة')) {
                return { bg: 'bg-teal-100 dark:bg-teal-900', text: 'text-teal-800 dark:text-teal-200', border: 'border-teal-200 dark:border-teal-700' };
            } else {
                return { bg: 'bg-gray-100 dark:bg-gray-700', text: 'text-gray-800 dark:text-gray-200', border: 'border-gray-200 dark:border-gray-600' };
            }
        }

        function calculateStats(data) {
            if(data.length === 0) return;
            document.getElementById('stats-banner').classList.remove('hidden');
            document.getElementById('stat-total').innerText = data.length;

            const finalDecisions = data.filter(item => item.status && item.status.includes('قرار نهائي')).length;
            document.getElementById('stat-final').innerText = finalDecisions;

            const sourceCounts = {};
            let maxCount = 0;
            let topSource = 'غير محدد';
            
            data.forEach(item => {
                const src = item.source || 'غير معروف';
                sourceCounts[src] = (sourceCounts[src] || 0) + 1;
                if (sourceCounts[src] > maxCount) {
                    maxCount = sourceCounts[src];
                    topSource = src;
                }
            });
            document.getElementById('stat-top-source').innerText = topSource;

            if (data[0] && data[0].timestamp) {
                const lastUpdateDate = new Date(data[0].timestamp);
                const today = new Date();
                const diffTime = Math.abs(today - lastUpdateDate);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                let waitingText = "";
                if (diffDays === 0) waitingText = "اليوم";
                else if (diffDays === 1) waitingText = "منذ أمس";
                else if (diffDays === 2) waitingText = "منذ يومين";
                else if (diffDays <= 10) waitingText = `${diffDays} أيام`;
                else waitingText = `${diffDays} يوماً`;
                document.getElementById('stat-waiting-time').innerText = waitingText;
            } else {
                document.getElementById('stat-waiting-time').innerText = "قيد الانتظار";
            }
        }

        async function loadNews() {
            const container = document.getElementById('news-container');
            const lastUpdate = document.getElementById('last-update');
            const sourceFilter = document.getElementById('sourceFilter');
            
            try {
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('فشل في جلب البيانات');
                
                const textData = await response.text();
                if (!textData.trim()) {
                    allNewsData = [];
                } else {
                    allNewsData = JSON.parse(textData);
                }
                
                if (allNewsData.length > 0) {
                    calculateStats(allNewsData);
                    const uniqueSources = [...new Set(allNewsData.map(item => item.source))];
                    uniqueSources.forEach(source => {
                        const option = document.createElement('option');
                        option.value = source;
                        option.textContent = source;
                        sourceFilter.appendChild(option);
                    });
                }

                currentFilteredNews = allNewsData; 
                renderNews(currentFilteredNews, false); 
                
                lastUpdate.innerText = `آخر تحديث: ${new Date().toLocaleString('ar-MA')}`;
            } catch (error) {
                console.error("خطأ في قراءة JSON:", error);
                container.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-3 font-medium text-center py-8">لم يتم العثور على مستجدات رسمية حتى الآن. راجعنا لاحقاً.</p>`;
            }
        }

        function renderNews(newsArray, isAppending = false) {
            const container = document.getElementById('news-container');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            if (!isAppending) {
                container.innerHTML = '';
                visibleCount = ITEMS_PER_PAGE;
            }
            
            if (newsArray.length === 0) {
                 container.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-3 font-medium text-center py-8">لا توجد أخبار حالياً أو لا توجد نتائج مطابقة لبحثك.</p>`;
                 loadMoreBtn.classList.add('hidden');
                 return;
            }

            const startIndex = isAppending ? visibleCount - ITEMS_PER_PAGE : 0;
            const itemsToRender = newsArray.slice(startIndex, visibleCount);

            itemsToRender.forEach(item => {
                const colors = getSourceColorClasses(item.source);
                const status = item.status || 'مستجد';
                const summary = item.summary || item.description;
                const tags = item.tags || ['مدونة الأسرة'];
                
                let tagsHTML = '';
                if (Array.isArray(tags)) {
                    tags.forEach(tag => {
                        tagsHTML += `<span onclick="filterByTag('${tag}')" class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-[10px] ml-1 mb-1 inline-block cursor-pointer hover:bg-red-100 hover:text-red-800 dark:hover:bg-red-900 dark:hover:text-red-200 transition-colors">#${tag}</span>`;
                    });
                }

                // تجهيز رسالة المشاركة الاجتماعية (نص + رابط)
                const shareText = encodeURIComponent(`عاجل: ${item.title}\nالمصدر: ${item.source}\nالتفاصيل: ${item.link}\n\nعبر منصة راصد مدونة الأسرة: ${SITE_URL}`);
                
                // روابط الأزرار
                const waLink = `https://api.whatsapp.com/send?text=${shareText}`;
                const xLink = `https://twitter.com/intent/tweet?text=${shareText}`;
                const fbLink = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(SITE_URL)}&quote=${encodeURIComponent(item.title)}`;

                const card = `
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6 hover:shadow-md transition-colors duration-300 relative overflow-hidden flex flex-col h-full">
                        <div class="absolute top-4 left-[-35px] -rotate-45 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 w-32 text-center text-[10px] font-bold py-1 shadow-sm border-b border-red-200 dark:border-red-700">
                            ${status}
                        </div>
                        <div class="flex justify-between items-start mb-4 pr-6">
                            <span class="bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-600 text-[10px] font-bold px-2 py-1 rounded-full">${item.date}</span>
                            <span class="${colors.bg} ${colors.text} border ${colors.border} text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">${item.source}</span>
                        </div>
                        <h4 class="text-lg font-bold text-gray-800 dark:text-white mb-2 leading-tight">${item.title}</h4>
                        <p class="text-gray-800 dark:text-gray-200 mb-3 text-sm font-medium border-r-2 border-red-500 pr-2">${summary}</p>
                        <p class="text-gray-500 dark:text-gray-400 mb-4 text-xs leading-relaxed line-clamp-3 hover:line-clamp-none transition-all duration-300 cursor-pointer" title="انقر لقراءة التفاصيل كاملة">${item.description}</p>
                        
                        <!-- مساحة فارغة تدفع الأزرار والهاشتاجات نحو الأسفل دائماً -->
                        <div class="flex-grow"></div>
                        
                        <div class="mt-4 mb-3">
                            ${tagsHTML}
                        </div>

                        <!-- شريط الأزرار (أزرار المشاركة + رابط المصدر) -->
                        <div class="flex items-center justify-between border-t border-gray-100 dark:border-gray-700 pt-4 mt-auto">
                            <div class="flex gap-4">
                                <!-- واتساب -->
                                <a href="${waLink}" target="_blank" title="مشاركة عبر واتساب" class="text-gray-400 hover:text-green-500 transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                                </a>
                                <!-- X -->
                                <a href="${xLink}" target="_blank" title="مشاركة عبر X" class="text-gray-400 hover:text-black dark:hover:text-white transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                                </a>
                                <!-- فيسبوك -->
                                <a href="${fbLink}" target="_blank" title="مشاركة عبر فيسبوك" class="text-gray-400 hover:text-blue-600 transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.801.006 1.602.046 2.398.12v3.136h-1.652c-1.365 0-1.637.76-1.637 1.828v2.474h3.336l-.41 3.667h-2.926v7.98H9.101z"/></svg>
                                </a>
                            </div>
                            <a href="${item.link}" target="_blank" class="text-red-800 dark:text-red-300 font-bold text-xs hover:underline bg-red-50 dark:bg-red-900/30 px-3 py-1.5 rounded-md transition-colors">المصدر 🔗</a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            if (visibleCount < newsArray.length) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        document.getElementById('load-more-btn').addEventListener('click', () => {
            visibleCount += ITEMS_PER_PAGE;
            renderNews(currentFilteredNews, true); 
        });

        function filterByTag(tag) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = tag;
            filterData();
            searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('sourceFilter').addEventListener('change', filterData);

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedSource = document.getElementById('sourceFilter').value;

            currentFilteredNews = allNewsData.filter(item => {
                const hasTag = item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || 
                                      item.description.toLowerCase().includes(searchTerm) ||
                                      hasTag;
                const matchesSource = selectedSource === 'all' || item.source === selectedSource;
                return matchesSearch && matchesSource;
            });
            
            renderNews(currentFilteredNews, false);
        }

        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
