<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راصد مدونة الأسرة | المنصة الرسمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-red-800 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="text-3xl">⚖️</span> راصد مدونة الأسرة
            </h1>
        </div>
    </header>

    <section class="bg-white py-12 border-b">
        <div class="container mx-auto px-4 text-center max-w-3xl">
            <h2 class="text-3xl font-bold text-red-900 mb-4">تتبع مسار تعديل مدونة الأسرة بالمغرب</h2>
            <p class="text-gray-600 text-lg">منصة آنية ترصد المستجدات من المصادر الموثوقة فقط.</p>
        </div>
    </section>

    <main class="container mx-auto px-4 py-12">
        
        <!-- قسم البحث والتصفية الجديد -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            
            <div class="w-full md:w-2/3 relative">
                <input type="text" id="searchInput" placeholder="ابحث في المستجدات (مثال: زواج القاصر، التعدد...)" 
                       class="w-full pl-4 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-800 focus:ring-1 focus:ring-red-800 transition">
                <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
            </div>

            <div class="w-full md:w-1/3">
                <select id="sourceFilter" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-800 bg-gray-50 text-gray-700">
                    <option value="all">جميع المصادر الرسمية</option>
                    <!-- سيتم إضافة المصادر المتاحة هنا تلقائياً -->
                </select>
            </div>
            
        </div>

        <div class="flex justify-between items-end mb-8 border-r-4 border-red-800 pr-3">
            <h3 class="text-2xl font-bold text-gray-800">المستجدات الموثقة</h3>
            <span id="last-update" class="text-sm text-gray-500">جاري التحديث...</span>
        </div>
        
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم حقن الأخبار هنا بواسطة JavaScript -->
        </div>
    </main>

    <script>
        let allNewsData = []; // متغير لتخزين الأخبار للبحث فيها لاحقاً

        async function loadNews() {
            const container = document.getElementById('news-container');
            const lastUpdate = document.getElementById('last-update');
            const sourceFilter = document.getElementById('sourceFilter');
            
            try {
                // قراءة ملف JSON
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                allNewsData = await response.json();
                
                // استخراج المصادر الفريدة لإضافتها للقائمة المنسدلة
                const uniqueSources = [...new Set(allNewsData.map(item => item.source))];
                uniqueSources.forEach(source => {
                    const option = document.createElement('option');
                    option.value = source;
                    option.textContent = source;
                    sourceFilter.appendChild(option);
                });

                // عرض الأخبار الأولية
                renderNews(allNewsData);
                
                lastUpdate.innerText = `آخر تحديث: ${new Date().toLocaleString('ar-MA')}`;
                
            } catch (error) {
                container.innerHTML = `<p class="text-gray-500 col-span-3 font-medium">جاري تحديث البيانات... أو لا توجد أخبار جديدة.</p>`;
                console.error("Error loading news:", error);
            }
        }

        // دالة مسؤولة عن رسم الأخبار في الموقع
        function renderNews(newsArray) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            if (newsArray.length === 0) {
                 container.innerHTML = `<p class="text-gray-500 col-span-3 font-medium">لم يتم العثور على نتائج مطابقة لبحثك.</p>`;
            } else {
                newsArray.forEach(item => {
                    const card = `
                        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-red-100 text-red-800 text-xs font-bold px-3 py-1 rounded-full">${item.date}</span>
                                <span class="text-xs text-gray-500 font-bold bg-gray-100 px-2 py-1 rounded">${item.source}</span>
                            </div>
                            <h4 class="text-xl font-bold text-gray-800 mb-2">${item.title}</h4>
                            <p class="text-gray-600 mb-4 text-sm leading-relaxed">${item.description}</p>
                            <a href="${item.link}" target="_blank" class="text-red-700 font-bold text-sm hover:underline">المصدر الرسمي 🔗</a>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            }
        }

        // تفعيل خاصية البحث عند الكتابة
        document.getElementById('searchInput').addEventListener('input', function(e) {
            filterData();
        });

        // تفعيل خاصية التصفية عند اختيار مصدر
        document.getElementById('sourceFilter').addEventListener('change', function(e) {
            filterData();
        });

        // دالة التصفية الشاملة
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedSource = document.getElementById('sourceFilter').value;

            const filteredNews = allNewsData.filter(item => {
                // التحقق من تطابق النص
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || 
                                      item.description.toLowerCase().includes(searchTerm);
                // التحقق من تطابق المصدر
                const matchesSource = selectedSource === 'all' || item.source === selectedSource;

                return matchesSearch && matchesSource;
            });

            renderNews(filteredNews);
        }

        // تشغيل الدالة عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
