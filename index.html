<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راصد مدونة الأسرة | المنصة الرسمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Tajawal', sans-serif; } 
        .timeline-container::before {
            content: ''; position: absolute; top: 0; bottom: 0; right: 1.5rem; width: 4px;
            background: #fca5a5; border-radius: 4px;
        }
        .dark .timeline-container::before { background: #991b1b; }
        .timeline-item::before {
            content: ''; position: absolute; top: 1.5rem; right: -0.65rem; width: 20px; height: 20px;
            border-radius: 50%; background: white; border: 4px solid #b91c1c; z-index: 10;
        }
        .dark .timeline-item::before { background: #1f2937; border-color: #ef4444; }
        .is-rumor-timeline::before { border-color: #f97316 !important; }
        mark.highlight { background-color: #fde047; color: #111827; padding: 0 4px; border-radius: 4px; }
        .dark mark.highlight { background-color: #ca8a04; color: #ffffff; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300">

    <header class="bg-red-800 dark:bg-gray-950 text-white shadow-md border-b-4 border-red-900 dark:border-red-900 transition-colors duration-300">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span class="text-3xl">⚖️</span> راصد مدونة الأسرة
            </h1>
            <button id="theme-toggle" class="p-2 rounded-lg bg-red-900 dark:bg-gray-800 hover:bg-red-700 dark:hover:bg-gray-700 transition">
                <span id="theme-toggle-icon" class="text-xl">🌙</span>
            </button>
        </div>
    </header>

    <section class="bg-white dark:bg-gray-800 py-12 border-b dark:border-gray-700 transition-colors duration-300">
        <div class="container mx-auto px-4 text-center max-w-3xl">
            <h2 class="text-3xl font-bold text-red-900 dark:text-red-500 mb-4">تتبع مسار تعديل مدونة الأسرة بالمغرب</h2>
            <p class="text-gray-600 dark:text-gray-400 text-lg">منصة آنية ترصد المستجدات الرسمية وتكافح الشائعات المتداولة.</p>
        </div>
    </section>

    <main class="container mx-auto px-4 py-8">
        
        <!-- التبويبات -->
        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <button id="tab-official" onclick="switchTab('رسمي')" class="tab-btn active-tab bg-red-800 text-white dark:bg-red-700 px-6 py-2 rounded-full font-bold shadow-md transition-colors duration-300">
                المستجدات الرسمية ⚖️
            </button>
            <button id="tab-rumors" onclick="switchTab('إشاعة')" class="tab-btn bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 px-6 py-2 rounded-full font-bold shadow-sm transition-colors duration-300">
                مرصد الشائعات 🚫
            </button>
        </div>

        <div id="stats-banner" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">المستجدات الرسمية</p>
                <p id="stat-total" class="text-3xl font-black text-red-800 dark:text-red-500">0</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">القرارات النهائية</p>
                <p id="stat-final" class="text-3xl font-black text-green-700 dark:text-green-500">0</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center flex flex-col justify-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">شائعات تم رصدها</p>
                <p id="stat-rumors" class="text-3xl font-black text-orange-600 dark:text-orange-400">0</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 text-center flex flex-col justify-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1 font-bold">فترة الهدوء الحالية</p>
                <p id="stat-waiting-time" class="text-xl font-bold text-gray-600 dark:text-gray-400">-</p>
            </div>
        </div>

        <div id="charts-section" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 hidden">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col items-center justify-center">
                <h4 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-2">الموثوقية: رسمي مقابل إشاعة</h4>
                <div class="relative w-full max-w-[250px]">
                    <canvas id="reliabilityChart"></canvas>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col items-center justify-center">
                <h4 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-2">نشاط الجهات الرسمية</h4>
                <div class="relative w-full">
                    <canvas id="sourcesChart"></canvas>
                </div>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between transition-colors duration-300">
            <div class="w-full md:w-2/3 relative">
                <input type="text" id="searchInput" placeholder="ابحث في المستجدات أو الشائعات (مثال: الحضانة، النفقة...)" 
                       class="w-full pl-4 pr-10 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-red-800 dark:focus:border-red-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white transition">
                <span class="absolute right-3 top-2.5 text-gray-400 dark:text-gray-500">🔍</span>
            </div>
            <div class="w-full md:w-1/3">
                <select id="sourceFilter" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-red-800 dark:focus:border-red-500 bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-white transition">
                    <option value="all">جميع المصادر</option>
                </select>
            </div>
        </div>
        
        <div class="flex justify-end gap-2 mb-4 pr-2">
            <button onclick="toggleViewMode('grid')" id="btn-grid" class="p-2 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 rounded-md font-bold text-sm shadow-sm transition">عرض البطاقات 🗂️</button>
            <button onclick="toggleViewMode('timeline')" id="btn-timeline" class="p-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-md font-bold text-sm shadow-sm transition hover:bg-red-50 dark:hover:bg-gray-600">الخط الزمني ⏳</button>
        </div>

        <!-- حاوية الأخبار -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 align-stretch relative">
            <!-- المحتوى يظهر هنا -->
        </div>

        <div class="text-center mt-10 mb-6" id="load-more-container">
            <button id="load-more-btn" class="hidden bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold py-3 px-8 rounded-full shadow-sm border border-gray-300 dark:border-gray-600 transition-colors duration-300">
                عرض المزيد ⬇️
            </button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleIcon = document.getElementById('theme-toggle-icon');
            const htmlElement = document.documentElement;
            
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                themeToggleIcon.textContent = '☀️';
            } else {
                htmlElement.classList.remove('dark');
                themeToggleIcon.textContent = '🌙';
            }

            themeToggleBtn.addEventListener('click', function() {
                htmlElement.classList.toggle('dark');
                if (htmlElement.classList.contains('dark')) {
                    localStorage.theme = 'dark';
                    themeToggleIcon.textContent = '☀️';
                } else {
                    localStorage.theme = 'light';
                    themeToggleIcon.textContent = '🌙';
                }
                if (window.myReliabilityChart) window.myReliabilityChart.update();
                if (window.mySourcesChart) window.mySourcesChart.update();
            });
        });

        let allNewsData = [];
        let currentFilteredNews = [];
        let visibleCount = 9;
        const ITEMS_PER_PAGE = 9;
        let activeTab = 'رسمي'; 
        let viewMode = 'grid'; 
        const SITE_URL = "https://ia-cymk.github.io/moudawana-tracker/";

        let reliabilityChartInstance = null;
        let sourcesChartInstance = null;
        Chart.defaults.font.family = "'Tajawal', sans-serif";

        function highlightText(text, keyword) {
            if (!keyword || !text) return text;
            const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedKeyword})`, 'gi');
            return text.replace(regex, `<mark class="highlight">$1</mark>`);
        }

        function drawCharts(data) {
            if(data.length === 0) return;
            document.getElementById('charts-section').classList.remove('hidden');

            const officials = data.filter(item => (item.type || 'رسمي') === 'رسمي').length;
            const rumors = data.filter(item => item.type === 'إشاعة').length;
            const sourcesData = {};
            data.forEach(item => {
                if ((item.type || 'رسمي') === 'رسمي') {
                    const src = item.source || 'أخرى';
                    sourcesData[src] = (sourcesData[src] || 0) + 1;
                }
            });

            const ctxReliability = document.getElementById('reliabilityChart').getContext('2d');
            if(reliabilityChartInstance) reliabilityChartInstance.destroy();
            window.myReliabilityChart = reliabilityChartInstance = new Chart(ctxReliability, {
                type: 'doughnut',
                data: {
                    labels: ['مستجدات رسمية', 'شائعات مكذبة'],
                    datasets: [{ data: [officials, rumors], backgroundColor: ['#991b1b', '#f97316'], borderWidth: 0, hoverOffset: 4 }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: () => document.documentElement.classList.contains('dark') ? '#d1d5db' : '#374151' } } } }
            });

            const ctxSources = document.getElementById('sourcesChart').getContext('2d');
            if(sourcesChartInstance) sourcesChartInstance.destroy();
            window.mySourcesChart = sourcesChartInstance = new Chart(ctxSources, {
                type: 'bar',
                data: {
                    labels: Object.keys(sourcesData),
                    datasets: [{ label: 'عدد المستجدات', data: Object.values(sourcesData), backgroundColor: '#dc2626', borderRadius: 4 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0, color: () => document.documentElement.classList.contains('dark') ? '#9ca3af' : '#4b5563' }, grid: { color: () => document.documentElement.classList.contains('dark') ? '#374151' : '#e5e7eb' } },
                        x: { ticks: { color: () => document.documentElement.classList.contains('dark') ? '#9ca3af' : '#4b5563' }, grid: { display: false } }
                    }
                }
            });
        }

        function toggleViewMode(mode) {
            viewMode = mode;
            const btnGrid = document.getElementById('btn-grid');
            const btnTimeline = document.getElementById('btn-timeline');
            const container = document.getElementById('news-container');

            if (mode === 'grid') {
                btnGrid.className = "p-2 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 rounded-md font-bold text-sm shadow-sm transition";
                btnTimeline.className = "p-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-md font-bold text-sm shadow-sm transition hover:bg-red-50 dark:hover:bg-gray-600";
                container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 align-stretch relative";
                container.classList.remove('timeline-container', 'pr-12');
            } else {
                btnTimeline.className = "p-2 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 rounded-md font-bold text-sm shadow-sm transition";
                btnGrid.className = "p-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-md font-bold text-sm shadow-sm transition hover:bg-red-50 dark:hover:bg-gray-600";
                container.className = "flex flex-col gap-6 relative timeline-container pr-12";
            }
            const currentSearchTerm = document.getElementById('searchInput').value.trim();
            renderNews(currentFilteredNews, false, currentSearchTerm);
        }

        function switchTab(tabType) {
            activeTab = tabType;
            const tabOfficial = document.getElementById('tab-official');
            const tabRumors = document.getElementById('tab-rumors');
            const container = document.getElementById('news-container');
            
            if(tabType === 'رسمي') {
                tabOfficial.className = "tab-btn active-tab bg-red-800 text-white dark:bg-red-700 px-6 py-2 rounded-full font-bold shadow-md transition-colors duration-300";
                tabRumors.className = "tab-btn bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 px-6 py-2 rounded-full font-bold shadow-sm transition-colors duration-300";
            } else {
                tabRumors.className = "tab-btn active-tab bg-orange-600 text-white dark:bg-orange-700 px-6 py-2 rounded-full font-bold shadow-md transition-colors duration-300";
                tabOfficial.className = "tab-btn bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-600 px-6 py-2 rounded-full font-bold shadow-sm transition-colors duration-300";
            }
            
            container.className = viewMode === 'grid' ? "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 align-stretch relative" : "flex flex-col gap-6 relative timeline-container pr-12";
            filterData();
        }

        function getSourceColorClasses(source, type) {
            if (type === 'إشاعة') return { bg: 'bg-orange-100 dark:bg-orange-900', text: 'text-orange-800 dark:text-orange-200', border: 'border-orange-200 dark:border-orange-700' };
            if (!source) return { bg: 'bg-gray-100 dark:bg-gray-700', text: 'text-gray-800 dark:text-gray-200', border: 'border-gray-200 dark:border-gray-600' };
            if (source.includes('الديوان الملكي') || source.includes('ملك')) return { bg: 'bg-green-100 dark:bg-green-900', text: 'text-green-800 dark:text-green-200', border: 'border-green-200 dark:border-green-700' };
            if (source.includes('وزارة العدل') || source.includes('عدل')) return { bg: 'bg-blue-100 dark:bg-blue-900', text: 'text-blue-800 dark:text-blue-200', border: 'border-blue-200 dark:border-blue-700' };
            if (source.includes('المجلس العلمي') || source.includes('علمي')) return { bg: 'bg-purple-100 dark:bg-purple-900', text: 'text-purple-800 dark:text-purple-200', border: 'border-purple-200 dark:border-purple-700' };
            if (source.includes('وكالة المغرب') || source.includes('MAP')) return { bg: 'bg-red-100 dark:bg-red-900', text: 'text-red-800 dark:text-red-200', border: 'border-red-200 dark:border-red-700' };
            if (source.includes('حكوم') || source.includes('أمانة')) return { bg: 'bg-teal-100 dark:bg-teal-900', text: 'text-teal-800 dark:text-teal-200', border: 'border-teal-200 dark:border-teal-700' };
            return { bg: 'bg-gray-100 dark:bg-gray-700', text: 'text-gray-800 dark:text-gray-200', border: 'border-gray-200 dark:border-gray-600' };
        }

        function calculateStats(data) {
            if(data.length === 0) return;
            document.getElementById('stats-banner').classList.remove('hidden');
            
            const officials = data.filter(item => (item.type || 'رسمي') === 'رسمي');
            const rumors = data.filter(item => item.type === 'إشاعة');
            
            document.getElementById('stat-total').innerText = officials.length;
            document.getElementById('stat-rumors').innerText = rumors.length;
            const finalDecisions = officials.filter(item => item.status && item.status.includes('قرار نهائي')).length;
            document.getElementById('stat-final').innerText = finalDecisions;

            if (officials[0] && officials[0].timestamp) {
                const lastUpdateDate = new Date(officials[0].timestamp);
                const today = new Date();
                const diffTime = Math.abs(today - lastUpdateDate);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                let waitingText = "";
                if (diffDays === 0) waitingText = "اليوم";
                else if (diffDays === 1) waitingText = "منذ أمس";
                else if (diffDays === 2) waitingText = "منذ يومين";
                else if (diffDays <= 10) waitingText = `${diffDays} أيام`;
                else waitingText = `${diffDays} يوماً`;
                document.getElementById('stat-waiting-time').innerText = waitingText;
            } else {
                document.getElementById('stat-waiting-time').innerText = "قيد الانتظار";
            }
        }

        async function loadNews() {
            const container = document.getElementById('news-container');
            
            try {
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('فشل في جلب البيانات');
                
                const textData = await response.text();
                if (!textData.trim()) {
                    allNewsData = [];
                } else {
                    allNewsData = JSON.parse(textData);
                }
                
                allNewsData.forEach(item => { if(!item.type) item.type = 'رسمي'; });
                
                if (allNewsData.length > 0) {
                    calculateStats(allNewsData);
                    drawCharts(allNewsData);
                    updateSourceDropdown();
                }
                
                filterData();
                
            } catch (error) {
                console.error("خطأ:", error);
                container.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-3 font-medium text-center py-8">لا يوجد أرشيف متاح حالياً.</p>`;
            }
        }
        
        function updateSourceDropdown() {
            const sourceFilter = document.getElementById('sourceFilter');
            sourceFilter.innerHTML = '<option value="all">جميع المصادر</option>';
            const currentTabNews = allNewsData.filter(item => item.type === activeTab);
            const uniqueSources = [...new Set(currentTabNews.map(item => item.source))];
            
            uniqueSources.forEach(source => {
                const option = document.createElement('option');
                option.value = source;
                option.textContent = source;
                sourceFilter.appendChild(option);
            });
        }

        function renderNews(newsArray, isAppending = false, searchTerm = '') {
            const container = document.getElementById('news-container');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            if (!isAppending) {
                container.innerHTML = '';
                visibleCount = ITEMS_PER_PAGE;
            }
            
            if (newsArray.length === 0) {
                 const msg = activeTab === 'رسمي' ? 'لا توجد مستجدات رسمية حالياً أو لا توجد نتائج مطابقة لبحثك.' : 'لا توجد شائعات مطابقة أو مرصودة.';
                 container.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-3 font-medium text-center py-8">${msg}</p>`;
                 loadMoreBtn.classList.add('hidden');
                 return;
            }

            const startIndex = isAppending ? visibleCount - ITEMS_PER_PAGE : 0;
            const itemsToRender = newsArray.slice(startIndex, visibleCount);

            itemsToRender.forEach(item => {
                const isRumor = item.type === 'إشاعة';
                const colors = getSourceColorClasses(item.source, item.type);
                const status = item.status || 'مستجد';
                
                const title = highlightText(item.title, searchTerm);
                const summary = highlightText(item.summary || item.description, searchTerm);
                const description = highlightText(item.description, searchTerm);
                const tags = item.tags || ['مدونة الأسرة'];
                
                const cardStyle = isRumor ? "bg-orange-50 dark:bg-gray-800 border-orange-200 dark:border-orange-900" : "bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700";
                const statusStyle = isRumor ? "bg-orange-600 text-white border-orange-700" : "bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 border-red-200 dark:border-red-700";

                let tagsHTML = '';
                if (Array.isArray(tags)) {
                    tags.forEach(tag => {
                        tagsHTML += `<span onclick="filterByTag('${tag}')" class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-[10px] ml-1 mb-1 inline-block cursor-pointer hover:bg-red-100 transition-colors">#${tag}</span>`;
                    });
                }

                let shareLabel = isRumor ? "تنبيه كاذب: " : "عاجل: ";
                const shareText = encodeURIComponent(`${shareLabel}${item.title}\nالمصدر: ${item.source}\nالتفاصيل: ${item.link}\n\nعبر منصة راصد مدونة الأسرة: ${SITE_URL}`);
                const waLink = `https://api.whatsapp.com/send?text=${shareText}`;
                
                const watermark = isRumor ? `<div class="absolute top-1/3 left-1/4 transform -rotate-12 text-6xl font-black text-red-500 opacity-10 pointer-events-none select-none">إشاعة 🚫</div>` : '';

                const timelineItemClass = viewMode === 'timeline' ? `timeline-item ${isRumor ? 'is-rumor-timeline' : ''} pr-4 w-full md:w-3/4 lg:w-2/3` : '';

                const card = `
                    <div class="${cardStyle} rounded-lg shadow-sm border p-6 hover:shadow-md transition-colors duration-300 relative overflow-hidden flex flex-col h-full ${timelineItemClass}">
                        ${watermark}
                        <div class="absolute top-4 left-[-35px] -rotate-45 ${statusStyle} w-32 text-center text-[10px] font-bold py-1 shadow-sm border-b">
                            ${status}
                        </div>
                        <div class="flex justify-between items-start mb-4 pr-6 z-10">
                            <span class="bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-600 text-[10px] font-bold px-2 py-1 rounded-full">${item.date}</span>
                            <span class="${colors.bg} ${colors.text} border ${colors.border} text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">${item.source}</span>
                        </div>
                        <h4 class="text-lg font-bold text-gray-800 dark:text-white mb-2 leading-tight z-10">${title}</h4>
                        <p class="text-gray-800 dark:text-gray-200 mb-3 text-sm font-medium border-r-2 ${isRumor ? 'border-orange-500' : 'border-red-500'} pr-2 z-10">${summary}</p>
                        <p class="text-gray-500 dark:text-gray-400 mb-4 text-xs leading-relaxed line-clamp-3 hover:line-clamp-none transition-all duration-300 cursor-pointer z-10">${description}</p>
                        
                        <div class="flex-grow"></div>
                        
                        <div class="mt-4 mb-3 z-10">
                            ${tagsHTML}
                        </div>

                        <div class="flex items-center justify-between border-t border-gray-200 dark:border-gray-700 pt-4 mt-auto z-10">
                            <div class="flex gap-4">
                                <a href="${waLink}" target="_blank" title="شارك" class="text-gray-400 hover:text-green-500 transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                                </a>
                            </div>
                            <a href="${item.link}" target="_blank" class="text-gray-800 dark:text-gray-300 font-bold text-xs hover:underline bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-md transition-colors">المصدر 🔗</a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            if (visibleCount < newsArray.length) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        document.getElementById('load-more-btn').addEventListener('click', () => {
            visibleCount += ITEMS_PER_PAGE;
            const currentSearchTerm = document.getElementById('searchInput').value.trim();
            renderNews(currentFilteredNews, true, currentSearchTerm); 
        });

        function filterByTag(tag) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = tag;
            filterData();
            searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('sourceFilter').addEventListener('change', filterData);

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            const lowerSearchTerm = searchTerm.toLowerCase();
            const selectedSource = document.getElementById('sourceFilter').value;

            currentFilteredNews = allNewsData.filter(item => {
                if (item.type !== activeTab) return false;
                
                const hasTag = item.tags && item.tags.some(tag => tag.toLowerCase().includes(lowerSearchTerm));
                const matchesSearch = item.title.toLowerCase().includes(lowerSearchTerm) || 
                                      item.description.toLowerCase().includes(lowerSearchTerm) ||
                                      hasTag;
                const matchesSource = selectedSource === 'all' || item.source === selectedSource;
                return matchesSearch && matchesSource;
            });
            
            updateSourceDropdown();
            renderNews(currentFilteredNews, false, searchTerm);
        }

        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
